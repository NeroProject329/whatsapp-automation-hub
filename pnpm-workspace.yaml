packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  baileys: true
  protobufjs: false
  '@scarf/scarf': false
  msgpackr-extract: false

overrides:
  '@prisma/config>deepmerge-ts': '8.0.0'
  'exceljs>uuid': '11.1.1'
